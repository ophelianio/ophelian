[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ophelian"
version = "1.0.0"
description = "Declarative ML framework: write a Pipeline once, run it anywhere — local Docker, AWS, GCP, Azure, or routed to the cheapest cloud."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Ophelian Maintainers" },
]
keywords = ["ml", "mlops", "pipeline", "declarative", "docker", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "docker>=7.1,<8",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "cloudpickle>=3.0,<4",
]

[project.optional-dependencies]
pytorch = ["torch>=2.2"]
huggingface = ["transformers>=4.40", "torch>=2.2"]
sklearn = ["scikit-learn>=1.4", "joblib>=1.4"]
xgboost = ["xgboost>=2.0"]
aws = [
    "boto3>=1.34",
    "botocore>=1.34",
    "paramiko>=3.4",
]
eks = [
    "boto3>=1.34",
    "botocore>=1.34",
    "kubernetes>=29.0",
]
gcp = [
    "google-cloud-storage>=2.18",
    "google-cloud-compute>=1.19",
    "google-auth>=2.30",
]
gke = [
    "google-cloud-storage>=2.18",
    "google-cloud-container>=2.49",
    "kubernetes>=29.0",
]
azure = [
    "azure-identity>=1.17",
    "azure-mgmt-compute>=33.0",
    "azure-mgmt-network>=25.4",
    "azure-mgmt-resource>=23.1",
    "azure-storage-blob>=12.20",
]
aks = [
    "azure-identity>=1.17",
    "azure-mgmt-containerservice>=31.0",
    "azure-storage-blob>=12.20",
    "kubernetes>=29.0",
]
pricing = []
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.8",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    # OTLP-over-HTTP exporters so auto_configure_otel() can wire up
    # spans + metrics with zero extra installs the moment a user sets
    # OTEL_EXPORTER_OTLP_ENDPOINT. We pick the proto-http variant
    # because it has fewer transitive deps than gRPC and works through
    # most corporate proxies.
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # Optional Prometheus scrape endpoint. The OTel Prometheus reader
    # writes into the prometheus_client default registry, which the
    # FastAPI runtime serves at ``/metrics`` when ``enable_prometheus``
    # is set on ``build_app`` (or ``OPHELIAN_PROMETHEUS=1`` on
    # ``app_from_env``).
    "opentelemetry-exporter-prometheus>=0.46b0",
    "prometheus_client>=0.20",
]
all = [
    "torch>=2.2",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "xgboost>=2.0",
    "boto3>=1.34",
    "botocore>=1.34",
    "paramiko>=3.4",
    "kubernetes>=29.0",
    "google-cloud-storage>=2.18",
    "google-cloud-compute>=1.19",
    "google-auth>=2.30",
    "azure-identity>=1.17",
    "azure-mgmt-compute>=33.0",
    "azure-mgmt-network>=25.4",
    "azure-mgmt-resource>=23.1",
    "azure-storage-blob>=12.20",
]
dev = [
    # lint / typecheck / test
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-docker>=7.1",
    # packaging (used by `python -m build` + `twine check` in CI / release)
    "build>=1.5",
    "twine>=6.0",
    # runtime extras the test suite exercises directly
    "scikit-learn>=1.4",
    "joblib>=1.4",
    # mocked AWS SDK + helpers used in unit tests
    "boto3>=1.34",
    "botocore>=1.34",
    "moto>=5.0",
    "paramiko>=3.4",
]

[project.scripts]
ophelian = "ophelian.cli.main:app"

[project.entry-points."ophelian.adapters"]
pytorch = "ophelian.models.pytorch_adapter:PyTorchAdapter"
huggingface = "ophelian.models.huggingface_adapter:HuggingFaceAdapter"
sklearn = "ophelian.models.sklearn_adapter:SklearnAdapter"
xgboost = "ophelian.models.xgboost_adapter:XGBoostAdapter"

# NOTE: Third-party clouds plug in via the ``ophelian.envs``
# entry-point group; this package ships AWS / GCP / Azure / Auto /
# Standalone directly. Community envs declare their own group in
# their distribution's pyproject.toml — see CONTRIBUTING.md.

[project.urls]
Homepage = "https://github.com/LuisFalva/ophelian"
Documentation = "https://luisfalva.github.io/ophelian/"
Repository = "https://github.com/LuisFalva/ophelian"
Issues = "https://github.com/LuisFalva/ophelian/issues"
Changelog = "https://github.com/LuisFalva/ophelian/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ophelian"]

[tool.hatch.build.targets.wheel.force-include]
"ophelian/py.typed" = "ophelian/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/ophelian",
    "/tests",
    "/examples",
    "/docs",
    "/mkdocs.yml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ophelian", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "SIM",            # simplify
    "C4",             # comprehensions
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", "examples/"]

[[tool.mypy.overrides]]
module = [
    "torch",
    "transformers",
    "sklearn",
    "sklearn.utils",
    "sklearn.datasets",
    "xgboost",
    "cloudpickle",
    "joblib",
    "pandas",
    "boto3",
    "botocore.exceptions",
    "kubernetes",
    "azure.identity",
    "azure.mgmt.compute",
    "azure.mgmt.network",
    "azure.storage.blob",
    "google.cloud",
    "opentelemetry.exporter.otlp.proto.http.trace_exporter",
    "opentelemetry.exporter.otlp.proto.http.metric_exporter",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring a real Docker daemon",
    "aws_integration: integration tests that hit a real AWS account (opt-in)",
]

[tool.coverage.run]
branch = true
source = ["ophelian"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
