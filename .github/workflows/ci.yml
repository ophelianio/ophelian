name: CI

# Triggers:
#   - every push to ANY branch (so feature branches get fast feedback)
#   - every PR targeting main (so reviewers see green/red before merging)
#   - manual dispatch (so anyone can re-run on demand)
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # the Release workflow handles tags
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fast follow-up commit
# stops the previous, now-stale CI run instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------
  # Lint, type-check, unit tests across the support matrix.
  # This is the gating job for branch protection.
  # ---------------------------------------------------------------
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest,  python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run ruff check ophelian tests

      - name: Ruff (format check)
        run: uv run ruff format --check ophelian tests

      - name: Mypy (strict)
        run: uv run mypy ophelian

      - name: Pytest (unit, with coverage gate)
        run: |
          uv run pytest \
            --cov=ophelian \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage XML (Linux 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Build the wheel + sdist on every push so we catch packaging
  # regressions (missing files, broken metadata) BEFORE tag time.
  # `twine check` validates that PyPI will render the README and
  # accept the metadata.
  # ---------------------------------------------------------------
  build-dist:
    name: Build & verify distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev

      - name: Build sdist + wheel
        run: uv run python -m build

      - name: Twine check (PyPI metadata)
        run: uv run twine check --strict dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------
  # Docker integration tests. Kept separate because they need a
  # real Docker daemon (only Linux runners have one out of the box)
  # and they're slower than the unit suite.
  # ---------------------------------------------------------------
  docker-integration:
    name: Docker integration · py3.12
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Verify Docker daemon is running
        run: docker info
      - name: Run Docker integration tests
        run: uv run pytest tests/test_docker_integration.py -v
