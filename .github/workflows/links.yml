name: Link check

# Markdown link checker for README, top-level policy files, and the
# mkdocs source under docs/. Runs on every push and PR plus manual
# dispatch. NO cron schedule by policy (see comment in security.yml).
#
# Three jobs:
#   1. internal  — `lychee --offline` verifies every relative link
#      points at a file that exists. Fatal.
#   2. anchors   — Python step verifies every `#fragment` link
#      resolves to a real heading using the GitHub Flavored
#      Markdown slug algorithm. Fatal. (We do this here instead of
#      via `lychee --include-fragments` because lychee's slugger
#      differs from GFM for headings containing `&`, e.g.
#      `Status & versioning` → `status--versioning`, which would
#      false-positive against this repo's TOC.)
#   3. external  — real HTTP fetches; `continue-on-error: true` so
#      flaky third-party servers don't block PRs. Warn-only.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # internal — relative-path link existence (offline, fatal).
  # ---------------------------------------------------------------
  internal:
    name: Internal links (fatal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Lychee (offline, internal links)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          # --offline       : skip all network requests; only verify
          #                   that relative paths resolve on disk.
          # --no-progress   : keep CI logs clean.
          # The file globs match exactly the docs surface area we
          # promise to keep clean (README + policy files + mkdocs
          # source). Test fixtures, examples/, and node_modules-like
          # directories are deliberately excluded.
          args: >-
            --offline
            --no-progress
            'README.md'
            'CONTRIBUTING.md'
            'CODE_OF_CONDUCT.md'
            'CHANGELOG.md'
            'SECURITY.md'
            'docs/**/*.md'
          fail: true
          format: detailed

  # ---------------------------------------------------------------
  # anchors — GFM-compatible heading-anchor verification (fatal).
  #
  # See header comment for why we don't reuse `lychee
  # --include-fragments` here. The script lives at
  # `scripts/check_doc_anchors.py` and uses only the Python stdlib,
  # so no `pip install` step is needed.
  # ---------------------------------------------------------------
  anchors:
    name: Doc anchors (fatal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Verify GFM heading anchors
        run: python3 scripts/check_doc_anchors.py

  # ---------------------------------------------------------------
  # external — real HTTP fetches (warn-only).
  # ---------------------------------------------------------------
  external:
    name: External links (warn-only)
    runs-on: ubuntu-latest
    # Soft-fail: a transient 503 from pypi.org or a flaky badge
    # service should never block a doc PR. The warning is still
    # visible in the PR's checks list and surfaces in the Actions
    # tab for triage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Lychee (external links)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          # --scheme http(s) : ignore mailto:, ftp:, file:, etc.
          # All other knobs (retries, timeout, accept list, cache)
          # come from lychee.toml at the repo root.
          args: >-
            --no-progress
            --scheme https
            --scheme http
            'README.md'
            'CONTRIBUTING.md'
            'CODE_OF_CONDUCT.md'
            'CHANGELOG.md'
            'SECURITY.md'
            'docs/**/*.md'
          fail: true
          format: detailed
