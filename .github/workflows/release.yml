name: Release

# Publishes to PyPI via OIDC Trusted Publishing — no API tokens needed.
# Trigger by pushing a `v*` tag (e.g. `v0.1.0`) or running the workflow manually.
#
# One-time setup on PyPI:
#   1. Create the project (or claim the existing `ophelian` name).
#   2. Add a Trusted Publisher pointing to:
#        - Repo:        LuisFalva/ophelia
#        - Workflow:    release.yml
#        - Environment: pypi
#   3. (Recommended) Create a GitHub environment called `pypi` with required
#      reviewers so a human approves every release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify metadata renders on PyPI
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ophelian
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
