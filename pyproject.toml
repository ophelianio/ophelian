[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ophelian"
version = "0.1.0"
description = "Declarative ML framework: write a Pipeline once, run it anywhere — local Docker, cloud, multi-cloud."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Ophelian Maintainers" },
]
keywords = ["ml", "mlops", "pipeline", "declarative", "docker", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "docker>=7.1,<8",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "cloudpickle>=3.0,<4",
    "pytest>=8.2",
    "scikit-learn>=1.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "joblib>=1.4",
    "build>=1.5.0",
    "twine>=6.2.0",
]

[project.optional-dependencies]
pytorch = ["torch>=2.2"]
huggingface = ["transformers>=4.40", "torch>=2.2"]
sklearn = ["scikit-learn>=1.4", "joblib>=1.4"]
xgboost = ["xgboost>=2.0"]
aws = [
    "boto3>=1.34",
    "botocore>=1.34",
    "paramiko>=3.4",
]
eks = [
    "boto3>=1.34",
    "botocore>=1.34",
    "kubernetes>=29.0",
]
all = [
    "torch>=2.2",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "xgboost>=2.0",
    "boto3>=1.34",
    "botocore>=1.34",
    "paramiko>=3.4",
    "kubernetes>=29.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-docker>=7.1",
    "boto3>=1.34",
    "botocore>=1.34",
    "moto>=5.0",
    "paramiko>=3.4",
]

[project.scripts]
ophelian = "ophelian.cli.main:app"

[project.entry-points."ophelian.adapters"]
pytorch = "ophelian.models.pytorch_adapter:PyTorchAdapter"
huggingface = "ophelian.models.huggingface_adapter:HuggingFaceAdapter"
sklearn = "ophelian.models.sklearn_adapter:SklearnAdapter"
xgboost = "ophelian.models.xgboost_adapter:XGBoostAdapter"

[project.urls]
Homepage = "https://github.com/LuisFalva/ophelia"
Repository = "https://github.com/LuisFalva/ophelia"
Issues = "https://github.com/LuisFalva/ophelia/issues"
Changelog = "https://github.com/LuisFalva/ophelia/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ophelian"]

[tool.hatch.build.targets.wheel.force-include]
"ophelian/py.typed" = "ophelian/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/ophelian",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ophelian", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "SIM",            # simplify
    "C4",             # comprehensions
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", "examples/"]

[[tool.mypy.overrides]]
module = [
    "torch",
    "transformers",
    "sklearn",
    "sklearn.utils",
    "sklearn.datasets",
    "xgboost",
    "cloudpickle",
    "joblib",
    "pandas",
    "boto3",
    "kubernetes",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring a real Docker daemon",
    "aws_integration: integration tests that hit a real AWS account (opt-in)",
]

[tool.coverage.run]
branch = true
source = ["ophelian"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
