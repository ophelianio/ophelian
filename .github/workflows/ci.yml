name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[sklearn,dev]'

      - name: Ruff (lint)
        run: ruff check ophelian tests

      - name: Ruff (format check)
        run: ruff format --check ophelian tests

      - name: Mypy (strict)
        run: mypy ophelian

      - name: Pytest
        run: pytest --cov=ophelian --cov-report=term-missing

  docker-integration:
    name: Docker integration · 3.12
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Docker daemon is running
        run: docker info

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[sklearn,dev]'

      - name: Run Docker integration tests
        run: pytest tests/test_docker_integration.py -v
