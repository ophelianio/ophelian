name: CodeQL

# GitHub's deep static analysis. Free for OSS, much more thorough
# than bandit. Results show up in the Security tab of the repo.
# Runs on every push to main and on every PR. Schedule (cron) is
# intentionally OFF to avoid scheduled-runner cost; trigger an extra
# scan manually via the "Run workflow" button in the Actions tab when
# auditing a long-quiet branch.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0daab03d71ff584ef619d027a3fd9146679c5d84  # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@0daab03d71ff584ef619d027a3fd9146679c5d84  # v3
        with:
          category: "/language:${{ matrix.language }}"
