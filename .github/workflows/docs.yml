name: Docs

# Build the mkdocs site on every PR (sanity check) and deploy to
# GitHub Pages on every push to ``main`` so the docs site tracks
# whatever is in the trunk. The release workflow does *not* deploy
# docs — we want the site to follow ``main``, not the last tag, so
# fixes to docs don't have to wait for the next PyPI release.

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "ophelian/**"
      # ``docs/security.md`` and ``docs/changelog.md`` snippet-include
      # ``SECURITY.md`` and ``CHANGELOG.md`` from the repo root, so
      # edits there must trigger a docs rebuild — otherwise the
      # published site stays stale until something else under
      # ``docs/`` changes.
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "ophelian/**"
      - "SECURITY.md"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # mkdocs git revision date plugin needs full history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
