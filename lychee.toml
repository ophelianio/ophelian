# Shared lychee link-checker configuration for the
# `.github/workflows/links.yml` jobs (internal + external).
# Reference: https://github.com/lycheeverse/lychee

# --- Network behavior ----------------------------------------------
# Generous retries so transient rate limits don't fail PRs.
max_retries        = 3
retry_wait_time    = 5
timeout            = 20
max_concurrency    = 8

# Accept these HTTP status codes as "link is alive".
# 403 and 429 are intentionally permissive: GitHub, npm, and a few
# CDNs sometimes return them to anonymous CI traffic. The internal
# job (`--offline`) does not perform HTTP at all; this list applies
# only to the external job.
accept = ["200..=299", "301", "302", "307", "308", "403", "429"]

# --- Cache ---------------------------------------------------------
# Cache successful results for one day so re-runs of the same PR
# don't hammer external servers.
cache         = true
max_cache_age = "1d"

# --- Ignore list ---------------------------------------------------
# Project-specific URL exclusions. Keep this short and document
# *why* each entry is here. Currently empty — populate only when a
# link is intentionally unreachable from CI (e.g. private
# dashboards, auth-walled URLs, time-windowed redirects).
exclude = [
  # ---------------------------------------------------------------
  # TEMPORARY pre-publish excludes (REMOVE after v1.0.0 is live)
  # ---------------------------------------------------------------
  # All entries below 404 today because the project hasn't been
  # published yet (chicken-and-egg). They will all resolve on their
  # own once the publish flow completes:
  #
  #   * `compare/...` and `releases/tag/...` — resolve when v1.0.0
  #     (and any prior version tags referenced from CHANGELOG) exist
  #     on the remote.
  #   * `blob/main/...` — resolve when the `main` branch is updated
  #     to the v1.0.0 source tree (currently still legacy).
  #   * `actions/workflows/<name>.yml/badge.svg` — GitHub renders the
  #     badge SVG only after the workflow has run on `main` at least
  #     once.
  #   * `ophelianio.github.io/ophelian/...` — the docs site is
  #     published by the `docs.yml` workflow on push to `main`; it
  #     does not exist yet.
  #
  # Action: delete this entire block as part of the v1.0.0 release
  # checklist, then re-run the link-check workflow to confirm every
  # URL resolves naturally.
  "^https://github\\.com/ophelianio/ophelian/compare/",
  "^https://github\\.com/ophelianio/ophelian/releases/tag/",
  "^https://github\\.com/ophelianio/ophelian/blob/main/",
  "^https://github\\.com/ophelianio/ophelian/actions/workflows/.*\\.svg$",
  "^https://ophelianio\\.github\\.io/ophelian/",
]

# --- Misc ----------------------------------------------------------
# Don't fail on `mailto:` links or local loopback URLs (these are
# never useful to check from CI).
include_mail     = false
exclude_loopback = true
