name: Security

# Four layers of automated security checks:
#   1. pip-audit       — known CVEs in our pinned dependency tree
#   2. bandit          — static analysis for common Python security issues
#   3. gitleaks        — scan diffs for accidentally-committed secrets
#   4. action-pin-check — block workflows that reference mutable action tags
#
# Runs on every push to any branch and on every PR. Schedule (cron)
# is intentionally OFF to avoid scheduled-runner cost. To re-scan a
# long-quiet branch for newly-disclosed CVEs, use the "Run workflow"
# button (workflow_dispatch) in the Actions tab.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # pip-audit — checks installed dependencies (resolved from
  # uv.lock) against the PyPI Advisory DB. Fails on any known CVE.
  # ---------------------------------------------------------------
  pip-audit:
    name: pip-audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --extra all
      - name: Export resolved requirements (all extras + dev)
        # Explicit extras list so the audit covers every dep that any
        # downstream user might install via `pip install ophelian[...]`.
        # `--all-extras` would also pull dev tools; we keep dev separate
        # because its purpose is documented (lint/test/build) and we want
        # advisories on dev tooling to surface here too.
        run: uv export --frozen --no-hashes --all-extras --format requirements-txt > requirements.audit.txt
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: requirements.audit.txt
          # Allow human review of advisories without ignoring them.
          # Add specific advisory IDs here only when accepting risk.
          ignore-vulns: ""

  # ---------------------------------------------------------------
  # bandit — static analysis for common Python security smells
  # (eval/exec, weak hashing, hardcoded secrets, etc.). Configured
  # to scan the library only; tests and examples are excluded.
  # ---------------------------------------------------------------
  bandit:
    name: bandit (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - name: Install bandit
        run: uv tool install "bandit[toml]>=1.7"
      - name: Run bandit
        run: uv tool run bandit -r ophelian -c pyproject.toml --severity-level medium

  # ---------------------------------------------------------------
  # gitleaks — detects committed secrets (AWS keys, GCP service
  # accounts, generic high-entropy strings). Scans the diff on PRs
  # and the full history on push to main or on manual dispatch.
  # ---------------------------------------------------------------
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      # We invoke the gitleaks binary directly instead of `gitleaks-action`,
      # which now requires a paid `GITLEAKS_LICENSE` for organization repos.
      # The CLI is fully featured and free. We pin the release version and
      # verify the binary against the project-published checksums file from
      # the same release (signed implicitly by GitHub's release pipeline).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "${base}/${tarball}" -o "${tarball}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Run gitleaks
        run: ./gitleaks detect --source . --redact --no-banner --verbose

  # ---------------------------------------------------------------
  # action-pin-check — every `uses:` line under `.github/workflows/`
  # must reference an immutable 40-char commit SHA, not a mutable
  # tag/branch like `@v4` or `@main`. A hijacked tag would otherwise
  # be enough to inject malicious code into the release pipeline.
  # See CONTRIBUTING.md ("Changes to .github/") for the rationale.
  # ---------------------------------------------------------------
  action-pin-check:
    name: action-pin-check (workflow SHA pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Verify all `uses:` references are pinned to a 40-char SHA
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          fail=0
          # Match any `uses: <ref>@<something>`; we then validate <something>
          # is exactly 40 lowercase hex chars. Local composite actions
          # (`uses: ./path`) don't contain `@` and are skipped naturally.
          pattern='^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[^[:space:]]+@'

          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            while IFS=: read -r lineno content; do
              # Strip trailing comment, then take the part after the last `@`.
              ref_with_comment="${content#*@}"
              ref="${ref_with_comment%%#*}"
              # Trim surrounding whitespace.
              ref="${ref#"${ref%%[![:space:]]*}"}"
              ref="${ref%"${ref##*[![:space:]]}"}"

              if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                # GitHub Actions error annotation: surfaces inline in the PR.
                echo "::error file=${file},line=${lineno}::Action is not pinned to an immutable 40-char commit SHA (found '@${ref}'). Pin it as 'uses: owner/repo@<40-char-sha>  # <tag>' so a hijacked tag can't slip into the release pipeline. See CONTRIBUTING.md."
                fail=1
              fi
            done < <(grep -nE "$pattern" "$file" || true)
          done

          if [[ "$fail" -ne 0 ]]; then
            echo ""
            echo 'One or more workflow `uses:` lines are not pinned to a commit SHA.'
            echo "Fix by replacing the mutable ref with the action's commit SHA, e.g.:"
            echo '  - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4'
            exit 1
          fi

          echo "All workflow actions are pinned to 40-char commit SHAs."
