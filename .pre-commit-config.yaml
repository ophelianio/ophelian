default_language_version:
  python: python3

default_stages: [pre-commit, pre-push]

# Ruff and mypy run via `uv run` so contributors always use the
# exact versions pinned in `uv.lock`. This avoids the drift you
# get when pinning a separate `rev:` for the ruff hook (the hook
# fossilises while the project's ruff keeps moving).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.replit|\.replitignore)$
      - id: end-of-file-fixer
        exclude: ^(\.replit|\.replitignore)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint, project version)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false

      - id: ruff-format
        name: ruff (format, project version)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false

      - id: mypy
        name: mypy --strict (project version)
        entry: uv run mypy ophelian
        language: system
        types: [python]
        files: ^ophelian/
        require_serial: true
        pass_filenames: false
